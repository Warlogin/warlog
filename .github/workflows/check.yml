name: Ice Snake Lab CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulator unit and incident tests
        run: npm test
      - name: Install Playwright, Chromium and Pillow
        run: |
          python3 -m pip install --upgrade playwright Pillow
          python3 -m playwright install --with-deps chromium
      - name: Build original test sprites
        run: python3 scripts/generate_assets.py
      - name: Browser / Canvas / keyboard smoke
        run: python3 scripts/browser_smoke.py
      - name: Upload browser artifacts if needed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: |
            *.png
            *.json
          if-no-files-found: ignore
      - name: Compile Python browser harnesses
        run: python3 -m py_compile scripts/server.py scripts/generate_assets.py scripts/browser_smoke.py scripts/extension_smoke.py

      - name: Check extension runner foreground safeguards
        run: python3 scripts/check_runner_foreground.py
